site:
  name: leoluyi/skills
  repo: https://github.com/leoluyi/skills
  site: https://leoluyi.tw/skills/

categories:
  - key: zh-writing-quality
    label: { en: "Traditional Chinese Writing", zh: "繁中寫作" }
    blurb:
      en: "Clean AI tells, mainland-China wording, and jargon, or draft a blog from scratch, so Traditional Chinese reads like a person wrote it."
      zh: "去掉 AI 味、陸用語和術語黑話，或從零寫出一篇部落格，讓繁體中文讀起來像真人寫的。"

  - key: business-docs
    label: { en: "Taiwan Business Documents", zh: "台灣商務公文" }
    blurb:
      en: "Draft and review 簽呈, meeting records, assessment reports, RFPs, and briefing outlines in Taiwan corporate Traditional Chinese."
      zh: "用台灣職場慣用的正體中文撰寫與審查簽呈、會議紀錄、評估報告、RFP 與說明提綱。"

  - key: presentation
    label: { en: "Presentation", zh: "簡報" }
    blurb:
      en: "Work a deck out one node at a time — what it is for, how it is structured, what the titles assert, how it opens, closes and gets delivered, and where the layout costs the room."
      zh: "一次一個節點把一場簡報做出來：這場要幹嘛、架構怎麼排、標題講什麼、開場收尾與表達怎麼走，以及版面在哪裡讓聽眾讀不到。"

  - key: docs-design
    label: { en: "Docs & Design", zh: "文件與設計" }
    blurb:
      en: "Language-agnostic professional tools: save-worthy explanatory graphics in SVG or HTML, and engineering-grade Diátaxis knowledge docs."
      zh: "跨語言的專業工具：讓人想收藏的說明圖表（SVG 或 HTML），以及工程等級的 Diátaxis 知識文件。"
    readmeNote:
      en: "Language-agnostic professional tools that stand on their own — no Chinese required."
      zh: "跨語言的專業工具，能獨當一面，不需要中文也能用。"

  - key: knowledge-mgmt
    label: { en: "Knowledge Management", zh: "知識管理" }
    blurb:
      en: "Learn a concept by being taught and quizzed, then file your own note into an Obsidian vault on PARA structure."
      zh: "先教後考學懂一個概念，再把親手寫的筆記歸檔進 PARA 結構的 Obsidian 筆記庫。"

  - key: data-recovery
    label: { en: "Data Recovery", zh: "資料救援" }
    blurb:
      en: "Pull deleted or lost data back out of an application's own cache before it's evicted for good."
      zh: "在應用程式自身快取被清掉之前，把刪掉或遺失的資料救回來。"
    readmeNote:
      en: "Language-agnostic; runs on any agent with shell access."
      zh: "跨語言工具，適用任何有 shell 存取權的 agent。"

  - key: agent-workflow
    label: { en: "Agent Workflow", zh: "Agent 工作流" }
    blurb:
      en: "Decide before you run, then bound the run: lay out every case, get decisions surfaced as choices, turn a plan or a fuzzy task into a goal with machine-checkable done conditions, hand the whole job over, and distil the taste rubric that says what good looks like."
      zh: "先想清楚再跑，跑起來也框得住：把每個案攤開、決策以選項浮上來、把計畫或模糊任務變成有機器可驗完成條件的 goal、整份工作交出去自動跑完，以及蒸餾出定義「好」長什麼樣的品味 rubric。"
    readmeNote:
      en: "Language-agnostic; runs on any agent that can execute a plan unattended."
      zh: "跨語言工具，適用任何能無人值守執行計畫的 agent。"
