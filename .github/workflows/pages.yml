name: Deploy docs to GitHub Pages

# Generates docs/index.html and docs/skills.json from skills/*/catalog.md +
# docs/catalog.yml (tools/build-docs), then publishes /docs to GitHub Pages.
# One-time setup: repo Settings > Pages > Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "skills/**/catalog.md"
      - "skills/**/guide.*.md"
      - "skills/**/SKILL.md"
      - "tools/build-docs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build docs/index.html + docs/skills.json
        run: uv run tools/build-docs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload /docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
